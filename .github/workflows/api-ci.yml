name: API CI

on:
  pull_request:
    paths:
      - 'enatega-multivendor-api/**'
      - 'enatega-multivendor-app/src/**'
      - 'enatega-multivendor-web/lib/**'
      - 'enatega-multivendor-rider/lib/**'
      - 'enatega-multivendor-store/lib/**'
      - 'enatega-multivendor-admin/lib/**'
      - 'enatega-singlevendor-admin/lib/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'enatega-multivendor-api/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enatega-multivendor-api
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: enatega-multivendor-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Client contract (every client GraphQL document validates against the schema)
        run: npm run check:contract

      - name: Integration tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/enatega_ci?directConnection=true

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enatega-api:${{ github.sha }} enatega-multivendor-api
