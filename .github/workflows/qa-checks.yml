name: QA Automation Checks

# Runs on every push and pull request that touches the QA suite or the
# Customer Web app. Two gates: fast static checks, then deterministic mock
# browser tests that never contact production.

on:
  push:
    paths:
      - 'qa-automation/**'
      - 'enatega-multivendor-web/**'
      - '.github/workflows/qa-checks.yml'
  pull_request:
    paths:
      - 'qa-automation/**'
      - 'enatega-multivendor-web/**'
      - '.github/workflows/qa-checks.yml'
  workflow_dispatch:

concurrency:
  group: qa-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck / lint / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qa-automation/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  mock-web:
    name: Deterministic Customer Web (mock)
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: qa-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            qa-automation/package-lock.json
            enatega-multivendor-web/package-lock.json
      - name: Install QA automation dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa-automation/package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Customer Web dependencies
        working-directory: enatega-multivendor-web
        run: npm ci --legacy-peer-deps
      - name: Provide a placeholder Customer Web env
        working-directory: enatega-multivendor-web
        run: |
          if [ ! -f .env ]; then
            {
              echo 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=ci-placeholder'
              echo 'NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:3000/__qa-api/'
              echo 'NEXT_PUBLIC_WS_SERVER_URL=ws://127.0.0.1:3000/__qa-api/'
            } > .env
          fi
      - name: Run mock browser suite
        run: npm run test:web:mock
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-web-report
          path: |
            qa-automation/reports/playwright
            qa-automation/reports/junit
          retention-days: 7
