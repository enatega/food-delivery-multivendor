appId: ${APP_ID}
---
# A release build reaches the discovery tab on the first attempt, and every
# dev-client-only step below is skipped after a single hierarchy check.
#
# A dev-client build (QA_MOBILE_APP_ID=com.enatega.multivendor) needs more:
# - clearState wipes its recent servers, so it cold-starts into the Expo dev
#   launcher and must be pointed back at the customer's Metro (METRO_URL).
# - the dev menu opens itself as a bottom sheet on that first launch and covers
#   the tab bar.
# - it intermittently aborts while loading the bundle
#   (react-native-reanimated: assert(jsiRuntime != nullptr) in
#   installTurboModule). Relaunching without clearState after that restores
#   stale navigation (e.g. the password screen), so the only reliable recovery is
#   to start the whole launch again from a clean state, hence the retry.
- retry:
    maxRetries: 3
    commands:
      - launchApp:
          appId: ${APP_ID}
          clearState: true
          clearKeychain: true
          permissions:
            all: deny
            location: inuse
            notifications: deny
      - repeat:
          while:
            notVisible:
              id: customer.tab.discovery
          times: 30
          commands:
            # Home screen means the app crashed: fail this attempt now instead
            # of spinning until the loop runs out.
            - assertNotVisible:
                id: spotlight-pill
            - runFlow:
                when:
                  visible:
                    text: "Development servers"
                commands:
                  - tapOn:
                      text: ${METRO_URL}
                      index: 0
            # The dev menu sheet's close control has no label, so dismiss it by
            # tapping the dimmed backdrop above the sheet.
            - runFlow:
                when:
                  visible:
                    text: "Connected to:"
                commands:
                  - tapOn:
                      point: "50%,20%"
      # The dev menu can also slide up just after the app renders.
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible:
              text: "Connected to:"
          commands:
            - tapOn:
                point: "50%,20%"
      - extendedWaitUntil:
          visible:
            id: customer.tab.discovery
          timeout: 30000
- assertVisible:
    id: customer.tab.discovery
