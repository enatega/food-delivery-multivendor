appId: ${APP_ID}
name: CM-P1-026 A wrong password is rejected and persists no session
tags:
  - regression
  - production-readonly
  - ios
---
# login.yaml exercises the client-side email regex, and CM-P1-007 proves the
# cart's auth gate holds for a guest. Nothing covers the credential check
# itself, so the most consequential auth failure there is — a bad password that
# still yields a session — would pass the entire suite.
#
# `useLogin.js` routes a rejected login through `onLoginError`, which raises a
# flash message and returns without navigating. The screen therefore stays up,
# and no token reaches AsyncStorage. Both halves are asserted: the screen must
# hold, and a restart must still land on the auth wall — the second is the one
# that actually proves no session was written, since a screen can stay put while
# a token is quietly persisted behind it.
#
# The flow then signs in correctly on the same screen. That is what makes the
# rejection meaningful: the identical control, with the identical email, does
# create a session when the password is right.
#
# Exactly ONE bad attempt is made, deliberately, against the shared automation
# account. Do not add more — the suite runs this account back to back, and a
# rate limit or lockout introduced server-side would take the whole suite down
# rather than just this flow.
#
# Read-only throughout: `login` issues no write beyond the session itself, and no
# cart or order is created.
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: customer.tab.profile
- assertVisible:
    id: customer.auth.welcome
- tapOn:
    id: customer.auth.continue-email
- assertVisible:
    id: customer.auth.email
- tapOn:
    id: customer.auth.email
- inputText: ${CUSTOMER_EMAIL}
# Dismiss with the return key, not just hideKeyboard. Cloud devices report
# "Couldn't hide the keyboard", and a keyboard left up covers the submit control
# below the field, so the tap lands on the keyboard and the screen never
# advances. This input defines no onSubmitEditing, so Enter only blurs.
# hideKeyboard stays as a fallback, optional so "no keyboard" is not a failure.
- pressKey: Enter
- hideKeyboard:
    optional: true
# The dismissal animates this screen's KeyboardAvoidingView, and a tap issued
# mid-animation resolves the control's position before it settles: the step
# reports success and nothing happens. Wait for the layout to stop moving.
- waitForAnimationToEnd:
    timeout: 5000
# Prove the field holds exactly the intended address before submitting, so a
# typing problem fails here rather than as a missing password field later.
- assertVisible:
    text: ".*${CUSTOMER_EMAIL}.*"
- tapOn:
    id: customer.auth.email-submit
# The email check is a production round trip, and reaching the password field is
# what flips the submit control's test ID to `login-submit`.
- extendedWaitUntil:
    visible:
      id: customer.auth.password
    timeout: 30000
# --- The wrong password ----------------------------------------------------
- tapOn:
    id: customer.auth.password
- inputText: QA-wrong-password-000
- pressKey: Enter
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: customer.auth.login-submit
# The login mutation is a production round trip. Wait long enough that "still on
# the login screen" means rejected rather than merely not finished yet — the
# happy path in login.yaml allows 30s to leave this screen, so anything short of
# that could pass while the request is still open.
- extendedWaitUntil:
    visible:
      id: customer.auth.password
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: customer.auth.login
- assertVisible:
    id: customer.auth.password
# `registeredEmail` stays true after a failed attempt, so the control must still
# be the login submit rather than reverting to the email check.
- assertVisible:
    id: customer.auth.login-submit
- takeScreenshot: login-wrong-password-rejected
# --- No session was persisted ----------------------------------------------
# Restarting without clearing state is the only way to tell a screen that merely
# stayed put from one that stayed put while writing a token. A session would
# survive this restart and render the Profile hub instead of the auth wall.
- stopApp:
    appId: ${APP_ID}
- launchApp:
    appId: ${APP_ID}
    clearState: false
- extendedWaitUntil:
    visible:
      id: customer.tab.discovery
    timeout: 30000
- tapOn:
    id: customer.tab.profile
- extendedWaitUntil:
    visible:
      id: customer.auth.welcome
    timeout: 30000
- assertNotVisible:
    id: customer.profile.screen
- takeScreenshot: login-wrong-password-no-session
# --- The correct password still works --------------------------------------
# Without this the rejection above could pass on a login screen that is simply
# broken for every credential.
- runFlow: ../../subflows/login.yaml
- runFlow: ../../subflows/open-profile.yaml
- assertVisible:
    id: customer.profile.screen
- takeScreenshot: login-correct-password-accepted
