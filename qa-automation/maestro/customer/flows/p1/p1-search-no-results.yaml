appId: ${APP_ID}
name: CM-P1-008 Search empty state and clear control
tags:
  - regression
  - production-readonly
  - ios
---
# SearchScreen renders `noResults` ("No Results Found") as the FlatList empty
# component, and Search.js renders `customer.search.clear` only while the query
# is non-empty. Both are asserted in each direction.
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: customer.tab.search
- extendedWaitUntil:
    visible:
      id: customer.search.input
    timeout: 15000
# No clear control is offered before anything is typed.
- assertNotVisible:
    id: customer.search.clear
- tapOn:
    id: customer.search.input
# A deliberately unmatchable token, so this never depends on live catalog data.
- inputText: zzqa000noresults
# Dismiss with the return key, not just hideKeyboard. Cloud devices report
# "Couldn't hide the keyboard", and a keyboard left up covers the submit control
# below the field, so the tap lands on the keyboard and the screen never
# advances. This input defines no onSubmitEditing, so Enter only blurs.
# hideKeyboard stays as a fallback, optional so "no keyboard" is not a failure.
- pressKey: Enter
- hideKeyboard:
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*No Results.*"
    timeout: 30000
- assertVisible:
    id: customer.search.clear
- takeScreenshot: search-no-results
- tapOn:
    id: customer.search.clear
# Clearing must retract both the empty state and the clear control itself.
- extendedWaitUntil:
    notVisible:
      text: ".*No Results.*"
    timeout: 15000
- assertNotVisible:
    id: customer.search.clear
# Search must recover: the allowlisted restaurant is still findable afterwards.
- tapOn:
    id: customer.search.input
- inputText: ${RESTAURANT_NAME}
- pressKey: Enter
- hideKeyboard:
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*${RESTAURANT_NAME}.*"
    timeout: 30000
- assertVisible:
    id: "customer\\.restaurant\\.card\\..*"
